<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Удаление турнира — TournamentHub</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: #e8eefc;
            background:
                radial-gradient(circle at top right, #20234a 0, transparent 35%),
                radial-gradient(circle at bottom left, #142d49 0, transparent 35%),
                #090d18;
        }

        .page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }

        .card {
            width: 100%;
            max-width: 620px;
            padding: 36px;
            text-align: center;
            background: rgba(21, 30, 48, 0.96);
            border: 1px solid #293853;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .icon {
            width: 76px;
            height: 76px;
            margin: 0 auto 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 22px;
            background: rgba(239, 68, 68, 0.13);
            border: 1px solid rgba(239, 68, 68, 0.3);
            font-size: 34px;
        }

        h1 {
            margin: 0 0 12px;
            color: #f87171;
            font-size: 29px;
        }

        .subtitle {
            margin: 0;
            color: #9eacc5;
            font-size: 14px;
            line-height: 1.7;
        }

        .warning {
            margin-top: 26px;
            padding: 23px;
            background: rgba(127, 29, 29, 0.13);
            border: 1px solid rgba(248, 113, 113, 0.3);
            border-radius: 14px;
            color: #fecaca;
        }

        .tournament-name {
            display: block;
            margin-bottom: 14px;
            color: #ffffff;
            font-size: 20px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .warning p {
            margin: 9px 0 0;
            font-size: 14px;
            line-height: 1.7;
        }

        .danger-text {
            margin-top: 16px !important;
            color: #f87171;
            font-weight: bold;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 28px;
        }

        .delete-button,
        .cancel {
            min-height: 46px;
            padding: 13px 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            font-family: inherit;
            text-decoration: none;
            transition: 0.2s ease;
        }

        .delete-button {
            border: 1px solid #dc2626;
            background: #dc2626;
            color: #ffffff;
            cursor: pointer;
        }

        .delete-button:hover {
            background: #b91c1c;
            border-color: #b91c1c;
            transform: translateY(-1px);
        }

        .cancel {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #202c42;
            border: 1px solid #354661;
            color: #dbeafe;
        }

        .cancel:hover {
            background: #2a3a55;
            border-color: #52709b;
        }

        @media (max-width: 600px) {
            .page {
                padding: 18px 12px;
            }

            .card {
                padding: 25px 18px;
            }

            h1 {
                font-size: 24px;
            }

            .warning {
                padding: 18px 14px;
            }

            .buttons {
                flex-direction: column;
            }

            .buttons form,
            .delete-button,
            .cancel {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <main class="page">
        <section class="card">

            <div class="icon">🗑️</div>

            <h1>Удаление турнира</h1>

            <p class="subtitle">
                Вы собираетесь удалить следующий турнир:
            </p>

            <div class="warning">
                <strong class="tournament-name">
                    «{{ tournament.name }}»
                </strong>

                <p>
                    Все заявки команд на этот турнир также будут удалены.
                </p>

                <p class="danger-text">
                    ⚠️ Это действие нельзя отменить.
                </p>
            </div>

            <div class="buttons">
                <form method="post">
                    {% csrf_token %}

                    <button type="submit" class="delete-button">
                        🗑️ Да, удалить турнир
                    </button>
                </form>

                <a
                    href="{% url 'tournament_detail' tournament.id %}"
                    class="cancel"
                >
                    Отмена
                </a>
            </div>

        </section>
    </main>
</body>
</html>
