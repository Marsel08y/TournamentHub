<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Регистрация команды — TournamentHub</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(
                    circle at top right,
                    rgba(59, 130, 246, 0.12),
                    transparent 35%
                ),
                #090d18;
            color: #e5e7eb;
        }

        .container {
            width: 100%;
            max-width: 720px;
            margin: 0 auto;
            padding: 55px 20px 40px;
        }

        .card {
            padding: 32px;
            background: #151e30;
            border: 1px solid #293853;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        .icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 58px;
            height: 58px;
            margin-bottom: 20px;
            background: rgba(59, 130, 246, 0.12);
            border: 1px solid #294a79;
            border-radius: 15px;
            font-size: 28px;
        }

        h1 {
            margin: 0 0 12px;
            color: #f8fafc;
            font-size: 29px;
            line-height: 1.35;
        }

        .description {
            margin: 0 0 25px;
            color: #9caec8;
            font-size: 14px;
            line-height: 1.7;
        }

        .info {
            margin-bottom: 25px;
            padding: 17px;
            background: #0d1525;
            border: 1px solid #294a79;
            border-radius: 12px;
            color: #cbd5e1;
            font-size: 14px;
            line-height: 1.7;
            overflow-wrap: anywhere;
        }

        .info strong {
            display: block;
            margin-bottom: 5px;
            color: #93c5fd;
        }

        .tournament-name {
            color: #f8fafc;
            font-size: 16px;
            font-weight: bold;
        }

        form p {
            margin: 0 0 22px;
        }

        label {
            display: block;
            margin-bottom: 9px;
            color: #dbeafe;
            font-size: 14px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            display: block;
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #354764;
            border-radius: 10px;
            background: #0d1525;
            color: #f3f4f6;
            font-family: Arial, sans-serif;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        select option {
            background: #151e30;
            color: #f3f4f6;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        .helptext {
            display: block;
            margin-top: 7px;
            color: #8da0bc;
            font-size: 12px;
            line-height: 1.5;
        }

        .errorlist {
            margin: 8px 0 0;
            padding-left: 20px;
            color: #fca5a5;
            font-size: 13px;
        }

        .errorlist li {
            margin-bottom: 5px;
        }

        .submit-button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 47px;
            margin-top: 25px;
            padding: 12px 18px;
            border: 1px solid #3b82f6;
            border-radius: 10px;
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .submit-button:hover {
            background: linear-gradient(135deg, #1d4ed8, #4338ca);
            transform: translateY(-2px);
            box-shadow: 0 7px 18px rgba(37, 99, 235, 0.2);
        }

        .back {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-top: 22px;
            padding: 11px 15px;
            border: 1px solid #354764;
            border-radius: 10px;
            background: #1b2940;
            color: #bfdbfe;
            font-size: 14px;
            text-decoration: none;
            transition: 0.2s;
        }

        .back:hover {
            background: #243651;
            border-color: #3b82f6;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px 12px 30px;
            }

            .card {
                padding: 23px 18px;
                border-radius: 16px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <section class="card">
            <div class="icon">📝</div>

            <h1>Регистрация команды</h1>

            <p class="description">
                Выберите команду и подайте заявку на участие
                в турнире. Организатор рассмотрит вашу заявку.
            </p>

            <div class="info">
                <strong>🏆 Турнир</strong>
                <span class="tournament-name">
                    {{ tournament.name }}
                </span>
            </div>

            <form method="post">
                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit" class="submit-button">
                    ✓ Подать заявку
                </button>
            </form>

            <a
                class="back"
                href="{% url 'tournament_detail' tournament.id %}"
            >
                ← Вернуться к турниру
            </a>
        </section>
    </main>
</body>
</html>
