<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация команды</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
        }

        h1 {
            margin-top: 0;
            color: #2563eb;
        }

        .info {
            background: #f1f3f7;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        button {
            margin-top: 20px;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            color: #555;
            text-decoration: none;
        }

        .errorlist {
            color: #dc2626;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📝 Регистрация команды</h1>

    <div class="info">
        <strong>Турнир:</strong>
        {{ tournament.name }}
    </div>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Подать заявку
        </button>

    </form>

    <a
        class="back"
        href="{% url 'tournament_detail' tournament.id %}"
    >
        ← Вернуться к турниру
    </a>

</div>

</body>
</html>
