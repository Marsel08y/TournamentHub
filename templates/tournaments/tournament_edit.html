<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Изменить турнир — TournamentHub</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 18px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f8fafc, #e0e7ff);
            color: #1e293b;
        }

        .container {
            max-width: 780px;
            margin: 0 auto;
            padding: 35px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 22px;
            box-shadow: 0 15px 45px rgba(30, 64, 175, 0.10);
        }

        .icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 58px;
            height: 58px;
            margin-bottom: 18px;
            border-radius: 16px;
            background: #dbeafe;
            font-size: 28px;
        }

        h1 {
            margin: 0 0 10px;
            color: #1d4ed8;
            font-size: 30px;
        }

        .description {
            margin: 0 0 30px;
            color: #64748b;
            line-height: 1.6;
        }

        form p {
            margin: 0 0 22px;
        }

        form label {
            display: block;
            margin-bottom: 9px;
            color: #334155;
            font-size: 14px;
            font-weight: 700;
        }

        form input:not([type="checkbox"]):not([type="radio"]),
        form select,
        form textarea {
            display: block;
            width: 100%;
            min-height: 48px;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 11px;
            background-color: #f8fafc;
            color: #1e293b;
            font-family: Arial, sans-serif;
            font-size: 15px;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }

        form textarea {
            min-height: 130px;
            resize: vertical;
            line-height: 1.5;
        }

        form input:focus,
        form select:focus,
        form textarea:focus {
            outline: none;
            border-color: #3b82f6;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.13);
        }

        form input[type="checkbox"],
        form input[type="radio"] {
            accent-color: #2563eb;
        }

        .helptext {
            display: block;
            margin-top: 7px;
            color: #94a3b8;
            font-size: 12px;
        }

        .errorlist {
            margin: 7px 0;
            padding-left: 20px;
            color: #dc2626;
            font-size: 13px;
        }

        .buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 30px;
            padding-top: 24px;
            border-top: 1px solid #e2e8f0;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 46px;
            padding: 12px 20px;
            border: none;
            border-radius: 11px;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: 0.2s;
        }

        .save {
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            color: white;
            box-shadow: 0 5px 14px rgba(37, 99, 235, 0.20);
        }

        .save:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.28);
        }

        .cancel {
            background: #f1f5f9;
            color: #475569;
        }

        .cancel:hover {
            background: #e2e8f0;
        }

        @media (max-width: 600px) {
            body {
                padding: 18px 10px;
            }

            .container {
                padding: 23px 18px;
                border-radius: 16px;
            }

            h1 {
                font-size: 25px;
            }

            .buttons {
                flex-direction: column;
            }

            .button {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <div class="icon">🏆</div>

        <h1>Изменить турнир</h1>

        <p class="description">
            Обнови название, игру, правила и остальные параметры турнира.
            После изменений нажми «Сохранить изменения».
        </p>

        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <div class="buttons">
                <button class="button save" type="submit">
                    💾 Сохранить изменения
                </button>

                <a class="button cancel"
                   href="{% url 'tournament_detail' tournament.id %}">
                    ← Отмена
                </a>
            </div>
        </form>
    </main>
</body>
</html>
