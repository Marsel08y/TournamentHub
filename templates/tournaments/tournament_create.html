<!DOCTYPE html>

<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
<title>Создание турнира — TournamentHub</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f6fb;
        color: #1f2937;
    }

    .page {
        max-width: 850px;
        margin: 0 auto;
        padding: 40px 20px;
    }

    .card {
        background: white;
        border-radius: 20px;
        padding: 32px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.07);
    }

    .header {
        margin-bottom: 30px;
    }

    .header h1 {
        margin: 0 0 10px;
        font-size: 30px;
        color: #111827;
    }

    .header p {
        margin: 0;
        color: #6b7280;
        font-size: 15px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
        color: #374151;
    }

    input,
    textarea,
    select {
        width: 100%;
        padding: 13px 14px;
        border: 1px solid #d1d5db;
        border-radius: 10px;
        background: white;
        color: #1f2937;
        font-size: 15px;
        font-family: Arial, sans-serif;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus,
    textarea:focus,
    select:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    textarea {
        min-height: 130px;
        resize: vertical;
    }

    .helptext {
        display: block;
        margin-top: 6px;
        color: #6b7280;
        font-size: 13px;
    }

    .errorlist {
        margin: 7px 0 0;
        padding-left: 20px;
        color: #dc2626;
        font-size: 14px;
    }

    .errorlist li {
        margin-bottom: 4px;
    }

    .buttons {
        display: flex;
        gap: 12px;
        align-items: center;
        margin-top: 28px;
        padding-top: 22px;
        border-top: 1px solid #e5e7eb;
    }

    .submit-button {
        border: none;
        border-radius: 10px;
        padding: 13px 20px;
        background: #2563eb;
        color: white;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.2s, transform 0.2s;
    }

    .submit-button:hover {
        background: #1d4ed8;
        transform: translateY(-1px);
    }

    .back-button {
        display: inline-block;
        padding: 13px 18px;
        border-radius: 10px;
        background: #f3f4f6;
        color: #374151;
        text-decoration: none;
        font-weight: bold;
        font-size: 15px;
        transition: background 0.2s;
    }

    .back-button:hover {
        background: #e5e7eb;
    }

    @media (max-width: 600px) {
        .page {
            padding: 20px 12px;
        }

        .card {
            padding: 22px;
            border-radius: 16px;
        }

        .header h1 {
            font-size: 24px;
        }

        .buttons {
            flex-direction: column;
            align-items: stretch;
        }

        .submit-button,
        .back-button {
            width: 100%;
            text-align: center;
        }
    }
</style>

</head>

<body>

<div class="page">

<div class="card">

    <div class="header">
        <h1>🏆 Создание турнира</h1>
        <p>
            Заполните информацию о турнире, чтобы создать новое соревнование.
        </p>
    </div>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <div class="buttons">

            <button type="submit" class="submit-button">
                🚀 Создать турнир
            </button>

            <a href="{% url 'home' %}" class="back-button">
                ← На главную
            </a>

        </div>

    </form>

</div>

</div>

</body>
</html>
