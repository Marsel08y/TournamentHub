
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Удаление команды — TournamentHub</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 16px;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f1f3f8;
            color: #202536;
        }

        .card {
            max-width: 600px;
            margin: 50px auto;
            padding: 30px;
            background: #fff;
            border: 1px solid #e0e4ed;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
        }

        h1 {
            margin-top: 0;
            font-size: 27px;
        }

        .warning {
            padding: 14px;
            background: #fff0f0;
            color: #a32323;
            border-radius: 10px;
            line-height: 1.6;
        }

        .buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 24px;
        }

        .btn {
            display: inline-block;
            padding: 12px 18px;
            border: none;
            border-radius: 9px;
            text-decoration: none;
            font-size: 15px;
            cursor: pointer;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-secondary {
            background: #e9edf5;
            color: #202536;
        }

        .btn:hover {
            opacity: 0.85;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Удаление команды</h1>

        <p>
            Ты действительно хочешь удалить команду
            <strong>{{ team.name }}</strong>?
        </p>

        <div class="warning">
            Внимание! Удаление команды может затронуть связанные данные.
            Это действие нельзя будет отменить.
        </div>

        <form method="post">
            {% csrf_token %}

            <div class="buttons">
                <button type="submit" class="btn btn-danger">
                    Да, удалить команду
                </button>

                <a href="{% url 'team_detail' team.id %}"
                   class="btn btn-secondary">
                    Отмена
                </a>
            </div>
        </form>
    </div>
</body>
</html>
