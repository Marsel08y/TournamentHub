<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Изменить команду — TournamentHub</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(
                    circle at top right,
                    rgba(59, 130, 246, 0.12),
                    transparent 35%
                ),
                #090d18;
            color: #e5e7eb;
        }

        .page {
            width: 100%;
            max-width: 760px;
            margin: 0 auto;
            padding: 55px 20px 40px;
        }

        .card {
            background: #151e30;
            border: 1px solid #293853;
            border-radius: 20px;
            padding: 32px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        .header {
            margin-bottom: 28px;
        }

        .header h1 {
            margin: 0 0 12px;
            color: #f8fafc;
            font-size: 30px;
            line-height: 1.3;
        }

        .header p {
            margin: 0;
            color: #9caec8;
            font-size: 14px;
            line-height: 1.7;
        }

        .team-name {
            color: #60a5fa;
            font-weight: bold;
        }

        .info {
            margin-bottom: 25px;
            padding: 15px 17px;
            background: rgba(59, 130, 246, 0.09);
            border: 1px solid #294a79;
            border-radius: 12px;
            color: #bfdbfe;
            font-size: 14px;
            line-height: 1.6;
        }

        form p {
            margin: 0 0 22px;
        }

        label {
            display: block;
            margin-bottom: 9px;
            color: #dbeafe;
            font-size: 14px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            display: block;
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #354764;
            border-radius: 10px;
            background: #0d1525;
            color: #f3f4f6;
            font-family: Arial, sans-serif;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        select option {
            background: #151e30;
            color: #f3f4f6;
        }

        input[type="checkbox"],
        input[type="radio"] {
            display: inline-block;
            width: auto;
            margin-right: 8px;
            accent-color: #3b82f6;
        }

        .helptext {
            display: block;
            margin-top: 7px;
            color: #8da0bc;
            font-size: 12px;
            line-height: 1.5;
        }

        .errorlist {
            margin: 8px 0 0;
            padding-left: 20px;
            color: #fca5a5;
            font-size: 13px;
        }

        .errorlist li {
            margin-bottom: 5px;
        }

        .buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            margin-top: 28px;
            padding-top: 23px;
            border-top: 1px solid #293853;
        }

        .save-button,
        .back-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 46px;
            padding: 12px 19px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            transition: 0.2s;
        }

        .save-button {
            border: 1px solid #3b82f6;
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            color: white;
            cursor: pointer;
        }

        .save-button:hover {
            background: linear-gradient(135deg, #1d4ed8, #4338ca);
            transform: translateY(-2px);
            box-shadow: 0 7px 18px rgba(37, 99, 235, 0.2);
        }

        .back-button {
            border: 1px solid #354764;
            background: #1b2940;
            color: #dbeafe;
        }

        .back-button:hover {
            background: #243651;
            transform: translateY(-2px);
        }

        @media (max-width: 600px) {
            .page {
                padding: 25px 12px 30px;
            }

            .card {
                padding: 22px 18px;
                border-radius: 16px;
            }

            .header h1 {
                font-size: 24px;
            }

            .buttons {
                flex-direction: column;
                align-items: stretch;
            }

            .save-button,
            .back-button {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <main class="page">
        <section class="card">
            <div class="header">
                <h1>✏️ Изменить команду</h1>

                <p>
                    Вы изменяете команду
                    <span class="team-name">«{{ team.name }}»</span>.
                    После сохранения обновлённые данные будут отображаться
                    на странице команды.
                </p>
            </div>

            <div class="info">
                👑 Изменять название команды может только её капитан.
            </div>

            <form method="post">
                {% csrf_token %}

                {{ form.as_p }}

                <div class="buttons">
                    <button type="submit" class="save-button">
                        💾 Сохранить изменения
                    </button>

                    <a
                        href="{% url 'team_detail' team.id %}"
                        class="back-button"
                    >
                        ← Вернуться к команде
                    </a>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
