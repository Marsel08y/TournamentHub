<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Добавить участника — TournamentHub</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 40px 16px;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(
                    circle at top right,
                    rgba(59, 130, 246, 0.12),
                    transparent 35%
                ),
                #090d18;
            color: #e5e7eb;
        }

        .container {
            width: 100%;
            max-width: 620px;
            margin: 25px auto;
            padding: 32px;
            background: #151e30;
            border: 1px solid #293853;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        .icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            margin-bottom: 20px;
            background: rgba(59, 130, 246, 0.12);
            border: 1px solid #294a79;
            border-radius: 15px;
            font-size: 27px;
        }

        h1 {
            margin: 0 0 16px;
            color: #f8fafc;
            font-size: 28px;
            line-height: 1.3;
        }

        .description {
            margin: 0 0 24px;
            color: #9caec8;
            font-size: 14px;
            line-height: 1.7;
        }

        .team-box {
            margin-bottom: 25px;
            padding: 15px 17px;
            background: #0d1525;
            border: 1px solid #293853;
            border-radius: 12px;
            color: #cbd5e1;
            font-size: 14px;
        }

        .team-name {
            color: #60a5fa;
            font-weight: bold;
        }

        form p {
            margin: 0 0 22px;
        }

        label {
            display: block;
            margin-bottom: 9px;
            color: #dbeafe;
            font-size: 14px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            display: block;
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #354764;
            border-radius: 10px;
            background: #0d1525;
            color: #f3f4f6;
            font-family: Arial, sans-serif;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        select option {
            background: #151e30;
            color: #f3f4f6;
        }

        .helptext {
            display: block;
            margin-top: 7px;
            color: #8da0bc;
            font-size: 12px;
            line-height: 1.5;
        }

        .errorlist {
            margin: 8px 0 0;
            padding-left: 20px;
            color: #fca5a5;
            font-size: 13px;
        }

        .errorlist li {
            margin-bottom: 5px;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 28px;
            padding-top: 23px;
            border-top: 1px solid #293853;
        }

        .invite-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 47px;
            padding: 12px 18px;
            border: 1px solid #3b82f6;
            border-radius: 10px;
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .invite-button:hover {
            background: linear-gradient(135deg, #1d4ed8, #4338ca);
            transform: translateY(-2px);
            box-shadow: 0 7px 18px rgba(37, 99, 235, 0.2);
        }

        .back {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            padding: 11px 16px;
            border: 1px solid #354764;
            border-radius: 10px;
            background: #1b2940;
            color: #dbeafe;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            transition: 0.2s;
        }

        .back:hover {
            background: #243651;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px 12px;
            }

            .container {
                margin: 15px auto;
                padding: 23px 18px;
                border-radius: 16px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <div class="icon">👥</div>

        <h1>Добавить участника</h1>

        <p class="description">
            Пригласите нового участника в свою команду.
            Заполните форму ниже и отправьте приглашение.
        </p>

        <div class="team-box">
            🏆 Команда:
            <span class="team-name">{{ team.name }}</span>
        </div>

        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <div class="buttons">
                <button type="submit" class="invite-button">
                    ✉️ Отправить приглашение
                </button>

                <a class="back" href="{% url 'team_detail' team.id %}">
                    ← Назад к команде
                </a>
            </div>
        </form>
    </main>
</body>
</html>
