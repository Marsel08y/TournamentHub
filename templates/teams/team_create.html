<!DOCTYPE html>

<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Создать команду — TournamentHub</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f6fb;
        color: #1f2937;
    }

    .page {
        max-width: 750px;
        margin: 0 auto;
        padding: 40px 20px;
    }

    .card {
        background: white;
        border-radius: 20px;
        padding: 32px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.07);
    }

    .header {
        margin-bottom: 28px;
    }

    .header h1 {
        margin: 0 0 10px;
        font-size: 30px;
        color: #111827;
    }

    .header p {
        margin: 0;
        color: #6b7280;
        font-size: 15px;
    }

    form p {
        margin: 0 0 20px;
    }

    label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
        color: #374151;
    }

    input,
    textarea,
    select {
        width: 100%;
        padding: 13px 14px;
        border: 1px solid #d1d5db;
        border-radius: 10px;
        background: white;
        color: #1f2937;
        font-size: 15px;
        font-family: Arial, sans-serif;
        outline: none;
    }

    input:focus,
    textarea:focus,
    select:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .helptext {
        display: block;
        margin-top: 6px;
        color: #6b7280;
        font-size: 13px;
    }

    .errorlist {
        margin: 7px 0 0;
        padding-left: 20px;
        color: #dc2626;
        font-size: 14px;
    }

    .buttons {
        display: flex;
        gap: 12px;
        margin-top: 28px;
        padding-top: 22px;
        border-top: 1px solid #e5e7eb;
    }

    .create-button {
        border: none;
        padding: 13px 20px;
        border-radius: 10px;
        background: #2563eb;
        color: white;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
    }

    .create-button:hover {
        background: #1d4ed8;
    }

    .back-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 13px 18px;
        border-radius: 10px;
        background: #f3f4f6;
        color: #374151;
        text-decoration: none;
        font-size: 15px;
        font-weight: bold;
    }

    .back-button:hover {
        background: #e5e7eb;
    }

    @media (max-width: 600px) {
        .page {
            padding: 20px 12px;
        }

        .card {
            padding: 22px;
        }

        .header h1 {
            font-size: 25px;
        }

        .buttons {
            flex-direction: column;
        }

        .create-button,
        .back-button {
            width: 100%;
        }
    }
</style>

</head>

<body>

<div class="page">

<div class="card">

    <div class="header">
        <h1>👥 Создать команду</h1>

        <p>
            Создайте команду, чтобы участвовать в турнирах TournamentHub.
        </p>
    </div>


    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}


        <div class="buttons">

            <button
                type="submit"
